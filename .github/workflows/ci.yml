name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  ci:
    name: Validate, Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wafrah_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d wafrah_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/wafrah_ci?schema=public
      DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/wafrah_ci?schema=public
      AUTH_SECRET: ci-throwaway-auth-secret-at-least-32-chars
      APP_URL: http://localhost:3000
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      CRON_SECRET: ci-throwaway-cron-secret-16c
      RESEND_API_KEY: ""
      FOUNDER_EMAIL: ci@wafrah.local
      NEXT_PUBLIC_WHATSAPP_NUMBER: "966500000000"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js & pnpm cache
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Prisma schema
        run: pnpm exec prisma validate

      - name: Migrate & seed throwaway Postgres
        run: |
          pnpm db:migrate:deploy
          pnpm db:seed

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Run Vitest suite
        run: pnpm test

      - name: Build production bundle
        run: pnpm build
